[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bountymode"
version = "0.2.0"
description = "Authorized security-testing workbench for bug bounty: scope enforcement, deny-by-default authorization gate, redacted evidence vault, CVSS triage, submission reports, and a vendored multi-domain offensive engine driven in-process."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bounty Mode contributors" }]
keywords = [
    "security", "bug-bounty", "red-teaming", "penetration-testing",
    "llm", "ai-security", "prompt-injection", "hackerone", "bugcrowd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The workflow layer (scope, gate, evidence, triage, report) has no required
# third-party dependency: it runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]

# Everything the vendored engine needs for a full in-process run: HTTP clients
# for the target, HTML parsing for recon, retry/backoff helpers.
engine = [
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "PyYAML>=5.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "requests>=2.31",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]
all = [
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "pillow>=10.0",
    "PyYAML>=5.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pytest>=7.0",
]

[project.scripts]
bountymode = "bountymode.cli:main"
bountymode-ui = "bountymode.ui.app:main"
bountymode-engine = "bountymode.engine.server:main"

[project.urls]
Homepage = "https://github.com/kkcyber2/bountymode"
Source = "https://github.com/kkcyber2/bountymode"
Issues = "https://github.com/kkcyber2/bountymode/issues"

[tool.setuptools.packages.find]
include = ["bountymode*"]

[tool.setuptools.package-data]
bountymode = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
